<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cuenta - Gestor Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #181818; color: #eee; font-family: 'Poppins', sans-serif; }
        .card { background-color: #242424; border: none; border-radius: 15px; padding: 2rem; }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="card">
        <h3 th:text="${account.id} == null ? 'Nueva Cuenta' : 'Editar Cuenta'"></h3>
        <form th:action="${account.id} == null ? @{/accounts} : @{'/accounts/update/' + ${account.id}}" 
              th:object="${account}" method="post">

            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Saldo</label>
                <input type="number" step="0.01" th:field="*{balance}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/accounts" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
