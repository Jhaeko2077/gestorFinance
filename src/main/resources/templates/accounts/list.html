<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cuentas - Gestor Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #181818; color: #eee; font-family: 'Poppins', sans-serif; }
        .card { background-color: #242424; border: none; border-radius: 15px; }
    </style>
</head>
<body>
<div class="container my-5">
    <h2 class="mb-4">Cuentas</h2>
    <a href="/accounts/new" class="btn btn-success mb-3">➕ Nueva Cuenta</a>
    <table class="table table-dark table-striped">
        <thead>
        <tr><th>Nombre</th><th>Saldo</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.name}">Cuenta</td>
            <td>S/ <span th:text="${account.balance}">0.00</span></td>
            <td>
                <a th:href="@{'/accounts/edit/' + ${account.id}}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{'/accounts/delete/' + ${account.id}}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary mt-3">Volver</a>
</div>
</body>
</html>
