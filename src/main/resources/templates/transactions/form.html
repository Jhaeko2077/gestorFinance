<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Transacción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #f0f0f0;
        }
        .container {
            max-width: 700px;
            margin-top: 60px;
            background-color: #1f1f1f;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }
        .form-control, .form-select {
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2c2c2c;
            color: #fff;
            border-color: #1e88e5;
            box-shadow: 0 0 5px #1e88e5;
        }
        .btn-custom {
            background-color: #1e88e5;
            color: white;
            border-radius: 8px;
            padding: 10px 16px;
            transition: 0.2s;
        }
        .btn-custom:hover {
            background-color: #1565c0;
        }
        label {
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">📝 Registrar Transacción</h3>

    <form th:action="@{/transactions}" th:object="${transaction}" method="post">
        <!-- Selección de cuenta -->
        <div class="mb-3">
            <label for="account" class="form-label">Cuenta</label>
            <select id="account" name="account.id" class="form-select" required>
                <option value="">Seleccione una cuenta</option>
                <option th:each="acc : ${accounts}"
                        th:value="${acc.id}"
                        th:text="${acc.name + ' (Saldo: ' + #numbers.formatDecimal(acc.balance,1,2) + ')'}"
                        th:selected="${transaction.account != null} ? ${acc.id} == ${transaction.account.id} : false"></option>
            </select>
        </div>

        <!-- Tipo -->
        <div class="mb-3">
            <label for="type" class="form-label">Tipo</label>
            <select id="type" name="type" class="form-select" required>
                <option value="">Seleccione...</option>
                <option value="INCOME" th:selected="${transaction.type == T(com.example.demo.model.Transaction.Type).INCOME}">Ingreso</option>
                <option value="EXPENSE" th:selected="${transaction.type == T(com.example.demo.model.Transaction.Type).EXPENSE}">Gasto</option>
            </select>
        </div>

        <!-- Monto -->
        <div class="mb-3">
            <label for="amount" class="form-label">Monto</label>
            <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="0.00"
                   th:value="${transaction.amount}" required>
        </div>

        <!-- Categoría -->
        <div class="mb-3">
            <label for="category" class="form-label">Categoría</label>
            <input type="text" id="category" name="category" class="form-control" maxlength="100"
                   th:value="${transaction.category}" placeholder="Ej: Alimentación, Transporte..." required>
        </div>

        <!-- Nota -->
        <div class="mb-3">
            <label for="note" class="form-label">Nota (opcional)</label>
            <textarea id="note" name="note" class="form-control" maxlength="500"
                      th:text="${transaction.note}" placeholder="Detalles adicionales..."></textarea>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-custom">Guardar</button>
            <a href="/transactions" class="btn btn-secondary ms-2">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
