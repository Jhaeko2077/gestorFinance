<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .table-dark th, .table-dark td {
            color: #f1f1f1;
        }
        .btn-custom {
            background-color: #1e88e5;
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            transition: background 0.2s;
        }
        .btn-custom:hover {
            background-color: #1565c0;
        }
        .container {
            margin-top: 50px;
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">💰 Lista de Transacciones</h2>

    <!-- Mensaje de éxito -->
    <div th:if="${success}" class="alert alert-success text-center" th:text="${success}"></div>

    <div class="mb-3 text-end">
        <a href="/transactions/new" class="btn btn-custom">+ Nueva Transacción</a>
    </div>

    <table class="table table-dark table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Cuenta</th>
            <th>Tipo</th>
            <th>Monto</th>
            <th>Categoría</th>
            <th>Nota</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.account.name}"></td>
            <td>
                <span th:classappend="${t.type.name() == 'INCOME'} ? 'text-success fw-bold' : 'text-danger fw-bold'"
                      th:text="${t.type}"></span>
            </td>
            <td th:text="${#numbers.formatDecimal(t.amount, 1, 2)}"></td>
            <td th:text="${t.category}"></td>
            <td th:text="${t.note}"></td>
            <td th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{'/transactions/delete/' + ${t.id}}" 
                   onclick="return confirm('¿Seguro que deseas eliminar esta transacción?')" 
                   class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${transactions.size() == 0}">
            <td colspan="8" class="text-center text-muted">No hay transacciones registradas.</td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary mt-3">Volver</a>
</div>

</body>
